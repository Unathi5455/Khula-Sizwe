# Two ways to use this:
#
#   docker compose up
#     Starts the dashboard at http://localhost:8050. This is the default
#     and only service that starts automatically.
#
#   docker compose run pipeline
#     Runs the full ingestion-to-features pipeline once, then exits. Not
#     started by `docker compose up` on its own (the `pipeline` profile
#     keeps it out of the default startup) - a multi-hour CHIRPS pull is
#     not something you want kicking off every time you start the stack.
#
# Both services mount ./data and ./models from the host, so data pulled by
# one survives a container restart and is immediately visible to the other -
# run the pipeline, then start the dashboard, and it sees what was just
# built without any extra copying.

services:
  dashboard:
    build: .
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "-m", "src.dashboard.app"]

  pipeline:
    build: .
    profiles: ["pipeline"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "-m", "src.orchestration.flow"]
